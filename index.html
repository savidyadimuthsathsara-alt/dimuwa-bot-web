<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimuwa Mini Bot Dashboard</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        background-color: #050202;
        color: #fff;
        font-family: 'Poppins', sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .app-container {
        width: 100%;
        max-width: 420px;
        background-color: #050202;
        position: relative;
        padding-bottom: 60px;
    }

    .header {
        display: flex;
        justify-content: space-between;
        padding: 15px 20px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 1px;
    }

    .header-left {
        color: #ff3333;
    }

    .header-right {
        color: #00ff00;
        display: flex;
        align-items: center;
        gap: 6px;
        text-shadow: 0 0 5px rgba(0,255,0,0.5);
    }

    .dot {
        width: 8px;
        height: 8px;
        background-color: #00ff00;
        border-radius: 50%;
        box-shadow: 0 0 8px #00ff00;
    }

    .main-card {
        background: linear-gradient(180deg, #110000 0%, #050000 100%);
        border: 1px solid rgba(255, 0, 0, 0.15);
        border-radius: 20px;
        margin: 0 15px;
        padding: 30px 20px;
        text-align: center;
        box-shadow:
            0 0 30px rgba(255, 0, 0, 0.05),
            inset 0 0 20px rgba(255, 0, 0, 0.05);
    }

    .logo-container {
        width: 90px;
        height: 90px;
        margin: 0 auto 15px;
        border-radius: 20px;
        padding: 2px;
        background: linear-gradient(45deg, #ff3333, #4a0000);
        box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
    }

    .logo {
        width: 100%;
        height: 100%;
        border-radius: 18px;
        object-fit: cover;
    }

    h1 {
        color: #ff3333;
        font-size: 22px;
        margin: 10px 0 5px;
        font-weight: 700;
        letter-spacing: 1px;
        text-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
    }

    .subtitle {
        color: #888;
        font-size: 10px;
        line-height: 1.4;
        margin-bottom: 20px;
        padding: 0 10px;
    }

    .welcome {
        color: #00ff00;
        font-size: 11px;
        font-weight: 600;
        margin-bottom: 20px;
        letter-spacing: 0.5px;
        text-shadow: 0 0 5px rgba(0, 255, 0, 0.3);
    }

    .input-dark {
        width: 100%;
        background: rgba(20, 0, 0, 0.5);
        border: 1px solid rgba(255, 0, 0, 0.3);
        color: #fff;
        padding: 12px;
        border-radius: 8px;
        font-family: 'Poppins', sans-serif;
        font-size: 12px;
        margin-bottom: 15px;
        text-align: center;
        outline: none;
        transition: 0.3s;
    }

    .input-dark:focus {
        border-color: #ff3333;
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
    }

    #code-display {
        color: #00ff00;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 5px;
        margin: 15px 0;
        text-shadow: 0 0 10px rgba(0, 255, 0, 0.4);
        display: none;
        background: #000;
        padding: 10px;
        border-radius: 8px;
        border: 1px dashed #00ff00;
    }

    #qr-container {
        margin: 15px auto;
        background: #fff;
        padding: 10px;
        border-radius: 8px;
        display: none;
        width: fit-content;
        min-height: 180px;
    }

    #qrcode {
        min-width: 160px;
        min-height: 160px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #111;
        font-size: 11px;
    }

    .status-message {
        display: none;
        margin: 12px 0;
        padding: 10px;
        border-radius: 8px;
        font-size: 11px;
        line-height: 1.4;
    }

    .status-success {
        display: block;
        color: #00ff00;
        border: 1px solid rgba(0,255,0,0.3);
        background: rgba(0,255,0,0.05);
    }

    .status-error {
        display: block;
        color: #ff5555;
        border: 1px solid rgba(255,0,0,0.3);
        background: rgba(255,0,0,0.05);
    }

    .btn-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 10px;
    }

    .btn {
        padding: 12px;
        border-radius: 8px;
        font-family: 'Poppins', sans-serif;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .btn-primary {
        background: #ff1a1a;
        color: #fff;
        border: none;
        box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
        background: #cc0000;
    }

    .btn-secondary {
        background: transparent;
        color: #ff8888;
        border: 1px solid rgba(255, 0, 0, 0.3);
    }

    .btn-secondary:hover:not(:disabled) {
        background: rgba(255, 0, 0, 0.05);
        color: #ff3333;
        border-color: #ff3333;
    }

    .btn-full {
        width: 100%;
        margin-bottom: 10px;
    }

    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 20px 15px;
    }

    .stat-box {
        background: #0a0202;
        border: 1px solid rgba(255, 0, 0, 0.15);
        border-radius: 12px;
        padding: 15px;
        text-align: left;
        transition: 0.3s;
    }

    .stat-title {
        color: #666;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 5px;
    }

    .stat-value {
        color: #ff3333;
        font-size: 15px;
        font-weight: 700;
    }

    .footer {
        text-align: center;
        color: #444;
        font-size: 10px;
        margin-top: 30px;
        letter-spacing: 0.5px;
    }

    .music-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: transparent;
        border: 1px solid #00ff00;
        color: #00ff00;
        padding: 8px 15px;
        border-radius: 20px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 1px;
    }
</style>

</head><body><div class="app-container"><div class="header">
    <div class="header-left">DIMUWA</div>
    <div class="header-right">
        <div class="dot"></div>
        ONLINE
    </div>
</div>

<div class="main-card">

    <div class="logo-container">
        <img
            src="https://files.catbox.moe/6gq4ub.jpeg"
            alt="Dimuwa Bot"
            class="logo"
        >
    </div>

    <h1>DIMUWA MINI</h1>

    <div class="subtitle">
        Next Generation WhatsApp Automation.<br>
        Powerful, fast, and completely secure.
    </div>

    <div class="welcome">
        WELCOME, DIMUWA ADMIN
    </div>

    <input
        type="text"
        id="phone-number"
        class="input-dark"
        placeholder="WhatsApp Number (e.g. 94740325746)"
        autocomplete="off"
        inputmode="numeric"
    >

    <div id="status-message" class="status-message"></div>

    <div id="code-display"></div>

    <div id="qr-container">
        <div id="qrcode"></div>
    </div>

    <div class="btn-grid">
        <button
            id="pair-btn"
            class="btn btn-primary"
            onclick="requestPairingCode()"
        >
            PAIR CODE
        </button>

        <button
            id="qr-btn"
            class="btn btn-primary"
            onclick="loadQRCode()"
            style="background: transparent; border: 1px solid #ff1a1a; color: #ff1a1a;"
        >
            SCAN QR
        </button>
    </div>

    <div class="btn-grid">
        <button
            class="btn btn-secondary"
            onclick="showBotDetails()"
        >
            BOT DETAILS
        </button>

        <button
            class="btn btn-secondary"
            onclick="unlinkBot()"
        >
            UNLINK BOT
        </button>
    </div>

    <button
        class="btn btn-secondary btn-full"
        onclick="logoutBot()"
    >
        LOGOUT
    </button>

</div>

<div class="stats-grid">

    <div class="stat-box">
        <div class="stat-title">SERVER</div>
        <div id="server-status" class="stat-value">CHECKING...</div>
    </div>

    <div class="stat-box">
        <div class="stat-title">LATENCY</div>
        <div id="latency" class="stat-value">-- ms</div>
    </div>

    <div class="stat-box">
        <div class="stat-title">UPTIME</div>
        <div id="uptime" class="stat-value">00:00:00</div>
    </div>

    <div class="stat-box">
        <div class="stat-title">ACTIVE BOTS</div>
        <div id="active-bots" class="stat-value">0</div>
    </div>

</div>

<div class="footer">
    © 2026 DIMUWA BOT. Created by DIMUTH SATHSARA
</div>

<div class="music-btn">
    🎵 MUSIC: ON
</div>

</div><script>

    const adminUsername = "admin";
    const startTime = Date.now();

    let qrRefreshTimer = null;

    function setStatus(message, type = "success") {
        const box = document.getElementById("status-message");

        box.innerText = message;
        box.className = "status-message " +
            (type === "error" ? "status-error" : "status-success");
    }

    function clearStatus() {
        const box = document.getElementById("status-message");
        box.innerText = "";
        box.className = "status-message";
    }

    function normalizePhoneNumber(value) {

        let phone = String(value || "").trim();

        phone = phone.replace(/[^0-9+]/g, "");

        if (phone.startsWith("+")) {
            phone = phone.substring(1);
        }

        if (phone.startsWith("0")) {
            phone = "94" + phone.substring(1);
        }

        return phone;
    }

    function setLoading(buttonId, loading) {
        const button = document.getElementById(buttonId);

        if (!button) return;

        button.disabled = loading;

        if (buttonId === "pair-btn") {
            button.innerText = loading ? "WAIT..." : "PAIR CODE";
        }

        if (buttonId === "qr-btn") {
            button.innerText = loading ? "LOADING..." : "SCAN QR";
        }
    }

    async function requestPairingCode() {

        clearStatus();

        const phoneInput = document.getElementById("phone-number");
        const phone = normalizePhoneNumber(phoneInput.value);

        const display = document.getElementById("code-display");
        const qrContainer = document.getElementById("qr-container");

        if (!phone) {
            setStatus("Please enter your WhatsApp number.", "error");
            return;
        }

        if (!/^94\d{9}$/.test(phone)) {
            setStatus(
                "Invalid Sri Lankan number. Example: 94740325746",
                "error"
            );
            return;
        }

        if (qrRefreshTimer) {
            clearInterval(qrRefreshTimer);
            qrRefreshTimer = null;
        }

        qrContainer.style.display = "none";
        display.style.display = "block";
        display.innerText = "WAIT...";

        setLoading("pair-btn", true);

        try {

            const response = await fetch("/get-pairing-code", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: adminUsername,
                    phone: phone
                })
            });

            const data = await response.json();

            if (response.ok && data.success && data.code) {

                display.innerText = data.code;

                setStatus(
                    "Pairing code generated. On WhatsApp go to Linked Devices → Link a Device → Link with phone number, then enter the code.",
                    "success"
                );

            } else {

                display.innerText = "ERROR";

                setStatus(
                    data.error || "Failed to generate pairing code.",
                    "error"
                );
            }

        } catch (error) {

            console.error(error);

            display.innerText = "FAILED";

            setStatus(
                "Server connection failed. Check your deployment logs.",
                "error"
            );

        } finally {

            setLoading("pair-btn", false);
        }
    }

    async function loadQRCode() {

        clearStatus();

        const display = document.getElementById("code-display");
        const qrContainer = document.getElementById("qr-container");
        const qrcodeDiv = document.getElementById("qrcode");

        display.style.display = "none";
        qrContainer.style.display = "block";

        setLoading("qr-btn", true);

        qrcodeDiv.innerHTML = "Loading QR...";

        try {

            const response = await fetch(
                `/get-qr?user=${encodeURIComponent(adminUsername)}&t=${Date.now()}`
            );

            const data = await response.json();

            if (!response.ok || !data.qr) {

                qrcodeDiv.innerText =
                    data.error || "QR unavailable. Please try again.";

                setStatus(
                    data.error || "Failed to generate QR.",
                    "error"
                );

                setLoading("qr-btn", false);
                return;
            }

            qrcodeDiv.innerHTML = "";

            new QRCode(qrcodeDiv, {
                text: data.qr,
                width: 180,
                height: 180,
                correctLevel: QRCode.CorrectLevel.M
            });

            setStatus(
                "QR generated. Scan it from WhatsApp → Linked Devices → Link a Device.",
                "success"
            );

            setLoading("qr-btn", false);

            startQRRefresh();

        } catch (error) {

            console.error(error);

            qrcodeDiv.innerText = "ERROR";

            setStatus(
                "Could not connect to the bot server.",
                "error"
            );

            setLoading("qr-btn", false);
        }
    }

    function startQRRefresh() {

        if (qrRefreshTimer) {
            clearInterval(qrRefreshTimer);
        }

        qrRefreshTimer = setInterval(async () => {

            try {

                const response = await fetch(
                    `/get-qr?user=${encodeURIComponent(adminUsername)}&t=${Date.now()}`
                );

                const data = await response.json();

                if (data.connected) {

                    clearInterval(qrRefreshTimer);
                    qrRefreshTimer = null;

                    document.getElementById("qr-container").style.display = "none";

                    setStatus(
                        "WhatsApp connected successfully! ✅",
                        "success"
                    );

                    updateStats();

                    return;
                }

                if (data.qr) {

                    const qrcodeDiv = document.getElementById("qrcode");

                    qrcodeDiv.innerHTML = "";

                    new QRCode(qrcodeDiv, {
                        text: data.qr,
                        width: 180,
                        height: 180,
                        correctLevel: QRCode.CorrectLevel.M
                    });
                }

            } catch (error) {
                console.log("QR refresh error:", error);
            }

        }, 12000);
    }

    async function unlinkBot() {

        const ok = confirm(
            "Are you sure you want to unlink this WhatsApp bot?"
        );

        if (!ok) return;

        clearStatus();

        try {

            const response = await fetch("/disconnect", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: adminUsername
                })
            });

            const data = await response.json();

            if (response.ok && data.success) {

                document.getElementById("code-display").style.display = "none";
                document.getElementById("qr-container").style.display = "none";

                setStatus(
                    "Bot successfully unlinked.",
                    "success"
                );

                updateStats();

            } else {

                setStatus(
                    data.error || "Unable to unlink bot.",
                    "error"
                );
            }

        } catch (error) {

            setStatus(
                "Failed to contact server.",
                "error"
            );
        }
    }

    function logoutBot() {

        alert(
            "Dashboard logout is not configured as a separate account system in this version. Use UNLINK BOT to remove the WhatsApp session."
        );
    }

    function showBotDetails() {

        alert(
            "DIMUWA MINI BOT\n\n" +
            "Version: 3.1\n" +
            "WhatsApp: Baileys\n" +
            "Pairing: QR + Pair Code\n" +
            "Creator: Dimuth Sathsara"
        );
    }

    async function updateStats() {

        const started = Math.floor(
            (Date.now() - startTime) / 1000
        );

        const hours = String(
            Math.floor(started / 3600)
        ).padStart(2, "0");

        const minutes = String(
            Math.floor((started % 3600) / 60)
        ).padStart(2, "0");

        const seconds = String(
            started % 60
        ).padStart(2, "0");

        document.getElementById("uptime").innerText =
            `${hours}:${minutes}:${seconds}`;

        const startPing = performance.now();

        try {

            const response = await fetch(
                `/stats?user=${encodeURIComponent(adminUsername)}&t=${Date.now()}`
            );

            const data = await response.json();

            const latency = Math.round(
                performance.now() - startPing
            );

            document.getElementById("latency").innerText =
                `${latency} ms`;

            document.getElementById("active-bots").innerText =
                data.activeBots ?? 0;

            document.getElementById("server-status").innerText =
                "ACTIVE";

        } catch (error) {

            document.getElementById("server-status").innerText =
                "OFFLINE";

            document.getElementById("latency").innerText =
                "-- ms";
        }
    }

    setInterval(updateStats, 5000);
    updateStats();

</script></body>
</html>
