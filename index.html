<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimuwa Mini Bot Dashboard</title>
    <style>
        body {
            background-color: #050505;
            color: #ff3333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 420px;
            margin: 20px auto;
            background: #0f0202;
            border: 2px solid #ff3333;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.4);
        }
        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid #ff3333;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
            object-fit: cover;
            margin-bottom: 10px;
        }
        h2 {
            color: #ff3333;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
            margin: 10px 0;
            font-size: 22px;
        }
        p {
            color: #ff8080;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .input-box, .btn {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid #ff3333;
            background: #1a0000;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .input-box::placeholder {
            color: #994444;
        }
        .btn {
            background: #ff3333;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }
        .btn:hover {
            background: #cc0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
        }
        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            background: #1a0000;
            border: 1px solid #00ff00;
            color: #00ff00;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 15px;
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.3);
        }
        #pairing-code-display {
            margin-top: 15px;
            font-size: 22px;
            color: #00ff00;
            font-weight: bold;
            letter-spacing: 3px;
            background: #000;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed #00ff00;
        }
        .footer {
            margin-top: 15px;
            font-size: 11px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://files.catbox.moe/6gq4ub.jpeg" alt="Bot Logo" class="logo">
        <h2>DIMUWA MINI BOT</h2>
        <p>Next Generation WhatsApp Automation & Management</p>
        
        <div class="status-badge">🟢 SYSTEM ONLINE</div>

        <div style="margin-top: 10px;">
            <input type="text" id="username" class="input-box" placeholder="Enter Username (e.g. admin)">
            <input type="text" id="phone-number" class="input-box" placeholder="WhatsApp Number (e.g. 94740325746)">
            <button class="btn" onclick="requestPairingCode()">GET PAIRING CODE</button>
            <div id="pairing-code-display"></div>
        </div>

        <div class="footer">
            © 2026 DIMUWA BOT. Created by Dimuth Sathsara
        </div>
    </div>

    <script>
        async function requestPairingCode() {
            const username = document.getElementById('username').value.trim();
            const phone = document.getElementById('phone-number').value.trim();
            const display = document.getElementById('pairing-code-display');

            if (!username || !phone) {
                alert("Please enter both Username and WhatsApp number!");
                return;
            }

            display.innerText = "Generating Code...";

            try {
                const response = await fetch('/get-pairing-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, phone: phone })
                });

                const data = await response.json();
                if (response.ok && data.success) {
                    display.innerText = data.code;
                } else {
                    display.innerText = "Error: " + (data.error || "Failed");
                }
            } catch (err) {
                display.innerText = "Connection Error!";
            }
        }
    </script>

</body>
</html>
